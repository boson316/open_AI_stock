name: Price Update
# 股價更新：Stooq 目前需要金鑰才能下載，排程先停用，只保留手動執行。
# 之後取得資料來源金鑰後，再恢復每週六的排程（cron: '23 2 * * 6'）。
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: price-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Download weekly prices (single-ticker failures keep previous price)
        timeout-minutes: 8
        run: python -u -m openstock.prices
      - run: pytest tests/financial/test_prices.py
      # 股價屬低風險資料，直接提交到 main；GITHUB_TOKEN 的推送不會觸發部署，所以手動觸發 Pages。
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/prices.json; then
            echo "No price changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json
          git commit -m "data: weekly price update"
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
