name: Price Update
# 股價更新：Yahoo Finance 日線為主、Stooq 為備援（設定 STOOQ_APIKEY secret 時附上金鑰）。
# 每週六台北 10:23 自動執行，也可手動執行；在哪個分支執行就提交到哪個分支，只有 main 會觸發部署。
on:
  schedule:
    - cron: '23 2 * * 6'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: price-update-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Download weekly prices (single-ticker failures keep previous price)
        timeout-minutes: 12
        run: python -u -m openstock.prices
        env:
          STOOQ_APIKEY: ${{ secrets.STOOQ_APIKEY }}
      - run: pytest tests/financial/test_prices.py
      # 股價屬低風險資料，直接提交到執行的分支；GITHUB_TOKEN 的推送不會觸發部署，所以在 main 時手動觸發 Pages。
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -N public/data/prices.json
          if git diff --quiet -- public/data/prices.json; then
            echo "No price changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json
          git commit -m "data: weekly price update"
          git push origin "HEAD:$BRANCH"
          if [ "$BRANCH" = "main" ]; then gh workflow run deploy.yml --ref main; fi
